name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Validate workflow
        run: devinstack validate playbooks/pr-regression.yaml
      - name: Verify sample PR gate
        run: devinstack run playbooks/pr-regression.yaml --workspace examples/calculator --out artifacts/report.json
      - name: Compare fictional benchmark fixtures
        run: devinstack compare --baseline benchmarks/fictional-baseline.jsonl --candidate benchmarks/fictional-candidate.jsonl --out artifacts/benchmark.json
      - name: Upload sample report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: ignore
