[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devinstack-poc"
version = "0.1.0"
description = "An open-source local PR regression gate and paired evaluation harness for agent-written code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]
license = {text = "MIT"}
keywords = ["devin", "agents", "regression", "benchmark", "ci"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
devinstack = "devinstack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
